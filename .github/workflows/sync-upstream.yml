# Keeps this fork current: merges PM3code (which follows T3 Code nightlies) and, when it merges
# cleanly, T3 Code main itself, into the `sync/upstream` branch and opens or updates one PR.
name: Sync upstream

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      t3code:
        description: "Also try T3 Code main directly"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'hoaivoke'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
      BRANCH: sync/upstream
      TRY_T3: ${{ github.event_name == 'schedule' || inputs.t3code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch upstreams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add pm3code https://github.com/maddada/pm3code.git
          git remote add t3code https://github.com/pingdotgg/t3code.git
          git fetch --no-tags pm3code pm
          git fetch --no-tags t3code main
          git switch -c "$BRANCH"

      - name: Merge
        id: merge
        run: |
          report=report.md
          : > "$report"
          merge() {
            local ref="$1" name="$2"
            local behind
            behind=$(git rev-list --count "HEAD..$ref")
            if [ "$behind" = "0" ]; then
              echo "- **$name**: already up to date." >> "$report"
              return 0
            fi
            if git merge --no-edit --no-ff "$ref" -m "chore: merge $name ($(git rev-parse --short "$ref"))"; then
              echo "- **$name**: merged $behind new commits." >> "$report"
              return 0
            fi
            local files
            files=$(git diff --name-only --diff-filter=U | sed 's/^/  - `/; s/$/`/')
            git merge --abort
            echo "- **$name**: $behind new commits, **not merged** (conflicts):" >> "$report"
            echo "$files" >> "$report"
            return 1
          }
          pm_ok=true
          merge pm3code/pm "PM3code" || pm_ok=false
          if [ "$TRY_T3" = "true" ]; then
            merge t3code/main "T3 Code main" || true
          fi
          echo "pm_ok=$pm_ok" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-list --count "origin/$BASE..HEAD")" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$report"

      - name: Open or update the pull request
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push --force origin "$BRANCH"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Automated upstream sync. Review the diff, let CI run, then merge." \
            "$(cat report.md)" \
            "Pull requests opened by this workflow do not start other workflows. To run CI, close and reopen this PR, or push any commit to \`$BRANCH\`. See docs/operations/upstream-sync.md.")
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "chore: sync upstream" --body "$body"
          fi

      - name: Flag PM3code conflicts
        if: steps.merge.outputs.pm_ok == 'false'
        run: |
          title="Upstream sync: PM3code does not merge cleanly"
          body=$(printf '%s\n\n%s\n' "$(cat report.md)" "Resolve by hand or with an agent; see docs/operations/upstream-sync.md.")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
