# Keeps this fork on top of PM3code, which follows T3 Code nightlies by rebasing (its history is
# rewritten on each sync, so merging it would duplicate commits). This fork's own commits are
# replayed onto PM3code's newest `pm` into `sync/upstream`, checked, and reported in one issue.
# Running the workflow with "promote" then moves the default branch there (old tip kept).
name: Sync upstream

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      promote:
        description: "Replace the default branch with sync/upstream when all checks pass (old tip kept as a backup branch)"
        type: boolean
        default: false
      build_preview:
        description: "Also build a downloadable Apple Silicon preview DMG from sync/upstream (does not publish a release)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'hoaivoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      state: ${{ steps.rebase.outputs.state }}
      ok: ${{ steps.check.outputs.ok }}
      upstream: ${{ steps.rebase.outputs.upstream }}
    env:
      GH_TOKEN: ${{ github.token }}
      # gh defaults a fork's issues and PRs to the parent repo; keep everything in this one.
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
      # The PM3code commit the default branch sits on. This fork's commits are the ones after it.
      MARK: upstream/pm3code
      BRANCH: sync/upstream
      ISSUE_TITLE: "Upstream sync"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Rebase this fork's commits onto PM3code
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add pm3code https://github.com/maddada/pm3code.git
          git fetch --no-tags pm3code pm
          upstream=$(git rev-parse pm3code/pm)
          mark=$(git rev-parse "origin/$MARK")
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          report=report.md
          if [ "$upstream" = "$mark" ]; then
            echo "state=current" >> "$GITHUB_OUTPUT"
            echo "PM3code has nothing new since \`$(git rev-parse --short "$mark")\`." > "$report"
            exit 0
          fi
          ours=$(git rev-list --count "$mark..origin/$BASE")
          upstream_date=$(git log -1 --format=%ci "$upstream")
          {
            echo "PM3code (which tracks T3 Code nightlies) moved from \`$(git rev-parse --short "$mark")\` to \`$(git rev-parse --short "$upstream")\` ($upstream_date: $(git log -1 --format=%s "$upstream"))."
            echo "Replaying this fork's $ours commits on top."
            echo
            echo "<details>"
            echo "<summary>Recent upstream commits (newest first, up to 25)</summary>"
            echo
            echo '```text'
            git log --oneline -n 25 "$upstream"
            echo '```'
            echo "</details>"
            echo
          } > "$report"
          git switch -c "$BRANCH" "origin/$BASE"
          if git rebase --onto "$upstream" "$mark"; then
            echo "state=rebased" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The lockfile is regenerated rather than merged by hand.
          rebasing() { [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; }
          while rebasing; do
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" = "pnpm-lock.yaml" ] \
              && git checkout --ours pnpm-lock.yaml \
              && vp install --lockfile-only \
              && git add pnpm-lock.yaml; then
              if GIT_EDITOR=true git rebase --continue; then break; fi
              continue
            fi
            {
              echo
              echo "**Conflict** replaying \`$(git log -1 --format='%h %s' REBASE_HEAD)\`:"
              echo "$conflicts" | sed 's/^/- `/; s/$/`/'
              echo
              echo "Resolve locally with the steps in \`docs/operations/upstream-sync.md\`."
            } >> "$report"
            git rebase --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "state=rebased" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.rebase.outputs.state == 'rebased'
        run: vp install

      - name: Check this fork's changes and critical features on the new base
        id: check
        if: steps.rebase.outputs.state == 'rebased'
        run: |
          all_ok=true

          if vp run check:changed pm3code/pm; then
            echo "- \`vp run check:changed pm3code/pm\`: **passed**" >> report.md
          else
            all_ok=false
            echo "- \`vp run check:changed pm3code/pm\`: **failed**" >> report.md
          fi

          if node scripts/pm-i18n.ts check; then
            echo "- \`node scripts/pm-i18n.ts check\`: **passed**" >> report.md
          else
            all_ok=false
            echo "- \`node scripts/pm-i18n.ts check\`: **failed**" >> report.md
          fi

          regression_tests=()
          for test_file in \
            packages/pm/src/identity.test.ts \
            packages/client-runtime/src/state/orchestrationV2Projection.test.ts \
            apps/server/src/project/AgentSessionImporter.test.ts \
            apps/server/src/sessionSync/liveSync.logic.test.ts \
            apps/server/src/sessionSync/AgentSessionLiveSync.test.ts \
            apps/server/src/pipelines/PmRouting.test.ts \
            apps/server/src/pm/PmReportWatcher.test.ts \
            apps/server/src/swarm/SwarmService.test.ts; do
            if [ -f "$test_file" ]; then
              regression_tests+=("$test_file")
            fi
          done
          if [ "${#regression_tests[@]}" -gt 0 ]; then
            if vp test run "${regression_tests[@]}"; then
              echo "- Fork regression suite (${#regression_tests[@]} test files): **passed**" >> report.md
            else
              all_ok=false
              echo "- Fork regression suite (${#regression_tests[@]} test files): **failed**" >> report.md
            fi
          fi

          echo "ok=$all_ok" >> "$GITHUB_OUTPUT"

      - name: Publish sync/upstream
        if: steps.rebase.outputs.state == 'rebased'
        run: git push --force origin "$BRANCH"

      - name: Promote
        id: promote
        if: inputs.promote && steps.rebase.outputs.state == 'rebased' && steps.check.outputs.ok == 'true'
        run: |
          backup="$BASE-before-sync-$(date -u +%Y%m%d-%H%M)"
          git push origin "origin/$BASE:refs/heads/$backup"
          git push --force-with-lease="$BASE:$(git rev-parse "origin/$BASE")" origin "$BRANCH:$BASE"
          git push --force origin "${{ steps.rebase.outputs.upstream }}:refs/heads/$MARK"
          echo >> report.md
          echo "Promoted: \`$BASE\` now has this fork's commits on PM3code \`$(git rev-parse --short "${{ steps.rebase.outputs.upstream }}")\`. The old tip is saved at branch \`$backup\`." >> report.md

      - name: Report
        run: |
          {
            cat report.md
            echo
            if [ "${{ steps.promote.outcome }}" != "success" ] && [ "${{ steps.rebase.outputs.state }}" = "rebased" ]; then
              if [ "${{ steps.check.outputs.ok }}" = "true" ]; then
                echo "All checks passed on \`$BRANCH\`. To promote it to \`$BASE\` (and trigger a new Agent Space Mac release): **Actions → Sync upstream → Run workflow → tick \`promote\`**."
                echo "To test a preview DMG first without touching \`$BASE\`, tick \`build_preview\`."
              else
                echo "One or more checks failed on \`$BRANCH\`. Review the workflow logs before promoting."
              fi
            fi
            echo
            echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.rebase.outputs.state }}" = "current" ]; then
            exit 0
          fi
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
            if [ "${{ steps.promote.outcome }}" = "success" ]; then gh issue close "$number"; fi
          elif [ "${{ steps.promote.outcome }}" != "success" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

  preview_mac_arm64:
    name: Build preview Mac DMG (sync/upstream)
    needs: sync
    if: github.repository_owner == 'hoaivoke' && inputs.build_preview && !inputs.promote && needs.sync.outputs.state == 'rebased' && needs.sync.outputs.ok == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout sync/upstream
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: sync/upstream
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Build preview app (unsigned)
        env:
          T3CODE_DESKTOP_SIGNED: "false"
          T3CODE_TELEMETRY_CHANNEL: dev
        run: |
          set -euo pipefail
          version="1.${{ github.run_number }}.0-preview.0"
          vp run dist:desktop:dmg:arm64 --build-version "$version" --verbose

      - name: Upload preview DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-space-sync-preview-arm64
          path: release/*.dmg
          retention-days: 7
