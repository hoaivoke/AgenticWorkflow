name: PM desktop packages

# t3code-pm: builds the fork's unsigned Windows x64 installer and Linux x64 AppImage with upstream's
# release-desktop.yml, then checks on real runners that each installs and runs beside official
# T3 Code without touching its install or data. Fork only: no secrets, no publishing. The
# release-assets artifact holds what a release uploads, update feed files included.

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version baked into the packages
        required: true
        default: "0.2.5"

permissions:
  # release-desktop.yml's Windows job reads this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

jobs:
  build_bundle:
    name: Build JS bundle
    if: github.repository == 'maddada/pm3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux_x64:
    name: Desktop Linux x64
    needs: [build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      # The Windows job embeds this archive as its WSL runtime.
      cli_archive: true

  win_x64:
    name: Desktop Windows x64
    needs: [build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64

  release_assets:
    name: Release assets
    needs: [linux_x64, win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*-x64
          path: pkg
          merge-multiple: true

      - name: Collect the release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # release-desktop.yml suffixes the Windows feed per arch for upstream's merge step;
          # PM3code ships x64 only, so it goes back to the name electron-updater reads.
          mv pkg/latest-win-x64.yml release/latest.yml
          cp pkg/*.exe pkg/*.exe.blockmap pkg/*.AppImage pkg/latest-linux.yml release/
          for feed in release/latest.yml release/latest-linux.yml; do
            echo "--- $feed"; cat "$feed"
            grep -q "^version: ${{ inputs.version }}$" "$feed"
          done
          ls -la release

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          compression-level: 0

  side_by_side_linux:
    name: Side by side (Linux x64)
    needs: [linux_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-x64
          path: pkg

      - name: Download the fork's CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: cli

      - name: Install runtime libraries
        # libfuse2t64 lets the t3-pm command mount the AppImage, as on a user's machine.
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libsecret-1-0 libnotify4 libxss1 libxtst6 xdg-utils desktop-file-utils libfuse2t64

      - name: Run the fork beside a pretend official install
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls "$PWD"/pkg/*.AppImage)"
          echo "AppImage: $(basename "$app")"
          chmod +x "$app"
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share" XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME/.t3/userdata" "$XDG_CONFIG_HOME/t3code-v2" "$XDG_DATA_HOME/applications"
          echo official-db > "$HOME/.t3/userdata/statev2.sqlite"
          echo official-profile > "$XDG_CONFIG_HOME/t3code-v2/Preferences"
          printf '[Desktop Entry]\nType=Application\nName=T3 Code\nExec=/opt/official/T3-Code.AppImage %%U\nMimeType=x-scheme-handler/t3code;\n' \
            > "$XDG_DATA_HOME/applications/com.t3tools.T3Code.desktop"
          official() { find "$HOME/.t3" "$XDG_CONFIG_HOME/t3code-v2" "$XDG_DATA_HOME/applications/com.t3tools.T3Code.desktop" -type f -exec sha256sum {} + | sort; }
          before="$(official)"

          (cd "$RUNNER_TEMP" && "$app" --appimage-extract '*.desktop' >/dev/null && echo "--- embedded desktop entry" && cat squashfs-root/*.desktop) || true
          echo "--- background service names in the bundled server"
          (cd "$RUNNER_TEMP" && "$app" --appimage-extract 'resources/*' >/dev/null)
          for name in com.t3codepm.service 90-t3code-pm-protect.conf T3CODE_PM_HOME; do
            grep -rqaF "$name" "$RUNNER_TEMP/squashfs-root/resources" || { echo "::error::$name is missing from the bundle."; exit 1; }
            echo "found $name"
          done

          # A global T3CODE_HOME, here the official home, must not move the fork's data.
          export T3CODE_HOME="$HOME/.t3"
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 150 xvfb-run -a "$app" --no-sandbox > "$RUNNER_TEMP/app.log" 2>&1 &
          runner=$!
          for _ in $(seq 1 120); do
            [[ -f "$HOME/.t3-pm/userdata/statev2.sqlite" && -f "$XDG_DATA_HOME/applications/com.t3codepm.T3CodePM.desktop" ]] && break
            sleep 1
          done
          sleep 5
          kill "$runner" 2>/dev/null || true
          wait "$runner" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/app.log" || true

          echo "--- home after the run"
          find "$HOME" -maxdepth 3 -not -path '*/.cache/*' | sort
          echo "--- fork URL-handler entry"
          cat "$XDG_DATA_HOME/applications/com.t3codepm.T3CodePM.desktop"

          test -f "$HOME/.t3-pm/userdata/statev2.sqlite"
          test -d "$XDG_CONFIG_HOME/t3code-pm"
          grep -q 'x-scheme-handler/t3code-pm;' "$XDG_DATA_HOME/applications/com.t3codepm.T3CodePM.desktop"
          grep -q 'Name=PM3code$' "$XDG_DATA_HOME/applications/com.t3codepm.T3CodePM.desktop"
          if [[ "$(official)" != "$before" ]]; then
            echo "::error::The fork changed the official install's files."
            diff <(echo "$before") <(official) || true
            exit 1
          fi
          echo "The official ~/.t3, profile and desktop entry are unchanged, with T3CODE_HOME=$T3CODE_HOME set."

      - name: Install the fork's background service beside an official one
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fake="$RUNNER_TEMP/home"
          shim="$fake/.local/bin/t3-pm"
          echo "--- t3-pm command the app wrote"; cat "$shim"

          # The fork publishes no runtime, so serve the archive this run built as the mirror.
          mirror="$RUNNER_TEMP/mirror"
          mkdir -p "$mirror/v$VERSION"
          cp cli/*.tar.gz "$mirror/v$VERSION/"
          (cd "$mirror/v$VERSION" && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$mirror" > "$RUNNER_TEMP/mirror.log" 2>&1 &

          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do [[ -S "$XDG_RUNTIME_DIR/bus" ]] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          units="$HOME/.config/systemd/user"
          mkdir -p "$units" "$HOME/.t3/userdata"
          printf '[Unit]\nDescription=Pretend official T3 Code server\n[Service]\nExecStart=/bin/sleep infinity\n[Install]\nWantedBy=default.target\n' > "$units/t3code.service"
          echo official-db > "$HOME/.t3/userdata/statev2.sqlite"
          systemctl --user daemon-reload
          systemctl --user enable --now t3code.service
          official() { find "$HOME/.t3" "$units/t3code.service" -type f -exec sha256sum {} + | sort; systemctl --user is-active t3code.service; systemctl --user is-enabled t3code.service; }
          before="$(official)"
          echo "$before"

          # A global T3CODE_HOME, here the official home, must not reach the service.
          export T3CODE_HOME="$HOME/.t3"

          echo "--- without a runtime mirror"
          if out="$("$shim" service install 2>&1)"; then
            echo "$out"; echo "::error::service install ran without a PM3code runtime."; exit 1
          fi
          echo "$out"
          grep -q "publishes none" <<<"$out"
          test ! -e "$units/t3code-pm.service"

          echo "--- with the fork's runtime"
          T3CODE_RELEASE_BASE_URL=http://127.0.0.1:8123 "$shim" service install
          echo "--- $units"; ls -la "$units"
          cat "$units/t3code-pm.service"
          grep -qx "Environment=T3CODE_HOME=$fake/.t3-pm" "$units/t3code-pm.service"
          grep -q "^StandardOutput=append:$fake/.t3-pm/" "$units/t3code-pm.service"
          if grep -q "$HOME/.t3/" "$units/t3code-pm.service"; then echo "::error::The fork's unit points at ~/.t3."; exit 1; fi
          systemctl --user status t3code-pm.service --no-pager || true
          "$shim" service status || true

          "$shim" service uninstall
          test ! -e "$units/t3code-pm.service"
          after="$(official)"
          if [[ "$after" != "$before" ]]; then
            echo "::error::The fork's service changed the official service or ~/.t3."
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "The official t3code.service and ~/.t3 are unchanged after installing and removing the fork's service."

  side_by_side_windows:
    name: Side by side (Windows x64)
    needs: [win_x64]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: pkg

      - name: Download official T3 Code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R pingdotgg/t3code --pattern 'T3-Code-*-x64.exe' --dir official

      - name: Install both, run the fork, uninstall the fork
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uninstallRoot = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          function Entries { Get-ChildItem $uninstallRoot -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like "T3 Code*" -or $_.DisplayName -like "PM3code*" } }
          function Folder($entry) { Split-Path ($entry.UninstallString -replace '^"([^"]+)".*$', '$1') }
          function Show($title) { Write-Host "--- $title"; Entries | Format-List PSChildName, DisplayName, DisplayVersion, Publisher, UninstallString | Out-String | Write-Host }

          $official = Get-ChildItem official\*.exe | Select-Object -First 1
          $fork = Get-ChildItem pkg\*.exe | Select-Object -First 1
          Write-Host "Official: $($official.Name)  Fork: $($fork.Name)"
          Start-Process $official.FullName -ArgumentList "/S" -Wait
          Show "after the official install"
          $officialEntry = Entries | Where-Object { $_.DisplayName -notlike "PM3code*" } | Select-Object -First 1
          if (-not $officialEntry) { throw "The official installer left no uninstall entry." }
          $officialFolder = Folder $officialEntry
          # A silent install may start the app; stop it so it cannot write while we compare.
          Start-Sleep -Seconds 5
          Get-Process | Where-Object { $_.Path -like "$officialFolder*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          New-Item -ItemType Directory -Force "$env:USERPROFILE\.t3\userdata" | Out-Null
          Set-Content "$env:USERPROFILE\.t3\userdata\statev2.sqlite" "official-db"
          function OfficialFiles {
            $paths = @("$env:USERPROFILE\.t3", $officialFolder)
            Get-ChildItem $paths -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { "$($_.FullName) $((Get-FileHash $_.FullName).Hash)" }
          }
          $before = OfficialFiles

          Start-Process $fork.FullName -ArgumentList "/S" -Wait
          Show "after the fork install"
          $forkEntry = Entries | Where-Object { $_.DisplayName -like "PM3code*" } | Select-Object -First 1
          if (-not $forkEntry) { throw "The fork installer left no 'PM3code' uninstall entry." }
          if ($forkEntry.PSChildName -eq $officialEntry.PSChildName) { throw "The fork reused the official uninstall key." }
          $forkFolder = Folder $forkEntry
          Write-Host "Official folder: $officialFolder  Fork folder: $forkFolder"
          if ($forkFolder -eq $officialFolder) { throw "The fork installed into the official folder." }
          Start-Sleep -Seconds 5
          Get-Process | Where-Object { $_.Path -like "$forkFolder*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          $startMenu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          Write-Host "--- Start menu"; Get-ChildItem $startMenu -Filter "*Code*" | ForEach-Object { Write-Host $_.Name }
          if (-not (Test-Path "$startMenu\PM3code.lnk")) { throw "No 'PM3code' Start menu shortcut." }

          if ($forkEntry.Publisher -ne "PM3code") { throw "The fork's Publisher is '$($forkEntry.Publisher)', not PM3code." }
          $exe = Get-ChildItem $forkFolder -Filter "*.exe" | Where-Object { $_.Name -notlike "Uninstall*" } | Select-Object -First 1
          # A global T3CODE_HOME, here the official home, must not move the fork's data.
          $env:T3CODE_HOME = "$env:USERPROFILE\.t3"
          Write-Host "Launching $($exe.FullName) with T3CODE_HOME=$env:T3CODE_HOME"
          $proc = Start-Process $exe.FullName -PassThru
          $db = "$env:USERPROFILE\.t3-pm\userdata\statev2.sqlite"
          for ($i = 0; $i -lt 120 -and -not (Test-Path $db); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          Get-Process | Where-Object { $_.Path -like "$forkFolder*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "--- fork data and profile"
          Get-ChildItem "$env:USERPROFILE\.t3-pm" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem "$env:APPDATA" -Filter "t3code*" | ForEach-Object { Write-Host $_.FullName }
          if (-not (Test-Path $db)) { throw "The fork did not create $db." }
          if (-not (Test-Path "$env:APPDATA\t3code-pm")) { throw "The fork did not use the t3code-pm profile." }
          $protocol = (Get-ItemProperty "HKCU:\Software\Classes\t3code-pm\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "t3code-pm:// handler: $protocol"
          $officialProtocol = (Get-ItemProperty "HKCU:\Software\Classes\t3code\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "t3code:// handler: $officialProtocol"
          if ($officialProtocol -and $officialProtocol -like "*PM3code*") { throw "The fork took over the official t3code:// handler." }

          $uninstall = $forkEntry.UninstallString -replace '^"([^"]+)".*$', '$1'
          Start-Process $uninstall -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          Show "after the fork uninstall"
          if (-not (Entries | Where-Object { $_.PSChildName -eq $officialEntry.PSChildName })) { throw "Uninstalling the fork removed the official app." }
          $after = OfficialFiles
          if (Compare-Object $before $after) {
            Compare-Object $before $after | Out-String | Write-Host
            throw "The fork changed the official install or ~/.t3."
          }
          Write-Host "The official install and ~/.t3 are unchanged after installing, running and uninstalling the fork."
